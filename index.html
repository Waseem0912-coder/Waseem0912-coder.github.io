<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waseem Ahmed — Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.svg" />
  <meta name="theme-color" content="#1a1f2e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Fira+Code:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
/* ─────────────────────────────────────────────────────────
   Portfolio variants — shared base + per-variant theming.
   Theming via CSS vars so the tweaks panel can swap accent
   and font live without re-rendering.
   ───────────────────────────────────────────────────────── */

:root {
  /* ── Field Notes (paper) ── */
  --fn-paper: #f1ece1;
  --fn-block: #e8e1d2;
  --fn-ink: #1c1a16;
  --fn-ink-mute: #5a544a;
  --fn-rule: #c9c1b1;
  --fn-rule-strong: #8a8273;
  --fn-accent: #c8492a;          /* persimmon */
  --fn-accent-deep: #9a3819;
  --fn-accent-soft: rgba(200, 73, 42, 0.13);

  /* ── Command Surface (dark) ── */
  --cmd-bg: oklch(0.16 0.018 245);
  --cmd-bg-elev: oklch(0.205 0.018 245);
  --cmd-surface: oklch(0.225 0.014 245);
  --cmd-border: oklch(0.30 0.012 245);
  --cmd-border-strong: oklch(0.42 0.012 245);
  --cmd-text: oklch(0.94 0.005 245);
  --cmd-mute: oklch(0.65 0.012 245);
  --cmd-mute-2: oklch(0.50 0.012 245);
  --cmd-accent: oklch(0.86 0.18 115);          /* chartreuse */
  --cmd-accent-soft: oklch(0.86 0.18 115 / 0.10);
  --cmd-accent-deep: oklch(0.7 0.16 115);
  --cmd-accent2: oklch(0.72 0.16 35);          /* terracotta */
  --cmd-accent2-soft: oklch(0.72 0.16 35 / 0.14);
}

/* host page background — quiet warm gray so both variants pop */
html, body {
  margin: 0;
  background: #2a2724;
  color: #ddd;
  font-family: ui-sans-serif, system-ui, sans-serif;
}

/* artboard wrappers fill their DCArtboard slot */
.variant-host {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  FIELD NOTES                                              ║
   ╚══════════════════════════════════════════════════════════╝ */

/* paper grain — barely-there texture */
.fn-grain {
  position: relative;
}
.fn-grain::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.35;
  mix-blend-mode: multiply;
  background-image:
    radial-gradient(rgba(60, 50, 35, 0.07) 1px, transparent 1px),
    radial-gradient(rgba(60, 50, 35, 0.05) 1px, transparent 1px);
  background-size: 3px 3px, 7px 7px;
  background-position: 0 0, 1px 2px;
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  COMMAND SURFACE                                          ║
   ╚══════════════════════════════════════════════════════════╝ */

.cmd-root {
  background: var(--cmd-bg);
  color: var(--cmd-text);
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 13px;
  line-height: 1.55;
  min-height: 100%;
  padding-bottom: 64px;
}

/* faint dot grid in the bg, like a real dashboard */
.cmd-root {
  background-image:
    radial-gradient(circle, oklch(0.25 0.014 245) 1px, transparent 1px);
  background-size: 24px 24px;
}

/* status bar */
.cmd-statusbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 32px;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--cmd-mute);
  border-bottom: 1px solid var(--cmd-border);
  background: oklch(0.14 0.018 245 / 0.92);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 10;
}
.cmd-statusbar .cmd-sep { margin: 0 12px; color: var(--cmd-border-strong); }
.cmd-status-left { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
.cmd-status-time { font-variant-numeric: tabular-nums; }
.cmd-status-right-meta {
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--cmd-mute);
}

/* Hero contact chips — bracketed buttons below the statement */
.cmd-contacts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}
.cmd-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  font-size: 12.5px;
  letter-spacing: 0.02em;
  color: var(--cmd-text);
  text-decoration: none;
  border: 1px solid var(--cmd-border-strong);
  background: var(--cmd-bg-elev);
  transition: border-color .15s, background .15s, color .15s, transform .15s;
}
.cmd-chip:hover {
  border-color: var(--cmd-accent);
  color: var(--cmd-accent);
  background: var(--cmd-accent-soft);
  transform: translateY(-1px);
}
.cmd-chip-icon { width: 14px; height: 14px; flex-shrink: 0; }
.cmd-chip-cta {
  background: var(--cmd-accent);
  color: var(--cmd-bg);
  border-color: var(--cmd-accent);
  font-weight: 600;
}
.cmd-chip-cta:hover {
  background: var(--cmd-accent-deep);
  color: var(--cmd-bg);
  border-color: var(--cmd-accent-deep);
}

/* Old toplinks kept for back-compat in case any cached pages reference them */
.cmd-toplinks { display: none; }
.cmd-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--cmd-accent);
  box-shadow: 0 0 8px var(--cmd-accent);
  margin-right: 10px;
  animation: cmd-pulse 2s ease-in-out infinite;
}
@keyframes cmd-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* frame inside status bar */
.cmd-frame {
  max-width: 1180px;
  margin: 0 auto;
  padding: 40px 32px 0;
}

/* hero */
.cmd-hero {
  padding: 24px 0 40px;
  border-bottom: 1px dashed var(--cmd-border);
  margin-bottom: 32px;
}
.cmd-hero-id {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--cmd-mute);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 16px;
}
/* hero — name + role on left, live log on right */
.cmd-hero-grid {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 40px;
  align-items: start;
}
.cmd-hero-left {
  display: flex;
  flex-direction: column;
  gap: 22px;
  min-width: 0;
}
.cmd-hero-right {
  display: flex;
  min-width: 0;
  position: sticky;
  top: 60px;
}

/* ── prominent role anchor under the name ────────────────── */
.cmd-anchor {
  position: relative;
  padding-left: 16px;
}
.cmd-anchor-rule {
  position: absolute;
  left: 0; top: 4px; bottom: 4px;
  width: 3px;
  background: var(--cmd-accent);
}
.cmd-anchor-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--cmd-text);
}
.cmd-anchor-role {
  color: var(--cmd-text);
}
.cmd-anchor-grade {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  padding: 2px 7px;
  color: var(--cmd-accent);
  background: var(--cmd-accent-soft);
  border: 1px solid var(--cmd-accent);
  transform: translateY(-2px);
}
.cmd-anchor-sep {
  color: var(--cmd-border-strong);
}
.cmd-anchor-co {
  color: var(--cmd-accent);
}
.cmd-anchor-sub {
  font-size: 12px;
  color: var(--cmd-mute);
  letter-spacing: 0.04em;
  margin-top: 4px;
}

/* ── big statement line ──────────────────────────────────── */
.cmd-statement {
  font-size: 26px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--cmd-text);
  font-weight: 400;
  max-width: 32ch;
}
.cmd-statement-mute {
  color: var(--cmd-mute);
}

/* ── Live log (right side of hero) ───────────────────────── */
.cmd-livelog {
  display: flex;
  flex-direction: column;
  width: 100%;
  background: oklch(0.14 0.018 245);
  border: 1px solid var(--cmd-border-strong);
  font-size: 12px;
  line-height: 1.55;
  position: relative;
  overflow: hidden;
}
.cmd-livelog::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    var(--cmd-accent) 0%,
    var(--cmd-accent2) 50%,
    transparent 100%);
}
.cmd-livelog-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px 10px;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--cmd-mute);
}
.cmd-livelog-meta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--cmd-accent);
  font-variant-numeric: tabular-nums;
}
.cmd-livelog-meta .cmd-dot {
  width: 6px; height: 6px; margin-right: 0;
}
.cmd-livelog-rule {
  height: 1px;
  background: var(--cmd-border);
  margin: 0 18px;
}
.cmd-livelog-body {
  padding: 14px 18px 10px;
  position: relative;
  min-height: 260px;
  height: 260px;
  flex: 0 0 auto;
}
/* Inner frame — absolutely positioned so rows start at top and grow down,
   exactly like the reference. Overflow hidden traps anything past the bottom. */
.cmd-livelog-frame {
  position: absolute;
  inset: 14px 18px 10px;
  overflow: hidden;
  font-size: 12.5px;
  line-height: 1.7;
}
/* Reference-trace layout: just glyph + body. No agent column.
   Label sits inline with the body, color-coded by kind. */
.cmd-log-line {
  display: grid;
  grid-template-columns: 18px 1fr;
  gap: 8px;
  padding: 1px 0;
  animation: cmd-log-in .35s cubic-bezier(.2, .8, .2, 1) both;
  align-items: baseline;
}
@keyframes cmd-log-in {
  from { opacity: 0; transform: translateY(4px); }
}
.cmd-log-out {
  animation: cmd-log-out .3s ease both;
}
@keyframes cmd-log-out {
  to { opacity: 0; transform: translateY(-6px); }
}
.cmd-log-prefix {
  font-weight: 500;
  font-size: 11px;
  padding-top: 1px;
}
.cmd-log-body {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cmd-log-label {
  display: inline-block;
  color: var(--cmd-mute);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-right: 10px;
}
.cmd-log-method {
  color: var(--cmd-accent);
  font-weight: 500;
}
.cmd-log-sep   { color: var(--cmd-border-strong); }
.cmd-log-args  { color: var(--cmd-mute); }

/* Semantic kind colors — derived from the same chroma/lightness as the
   chartreuse/terracotta accents so they sit in the existing palette. */
.cmd-log-think .cmd-log-prefix { color: oklch(0.74 0.10 240); }
.cmd-log-think .cmd-log-body   { color: var(--cmd-mute); font-style: italic; }
.cmd-log-think .cmd-log-body em { color: oklch(0.74 0.10 240); font-style: italic; }

.cmd-log-call  .cmd-log-prefix { color: var(--cmd-accent); }
.cmd-log-call  .cmd-log-body   { color: var(--cmd-text); }

.cmd-log-obs   .cmd-log-prefix { color: oklch(0.78 0.12 150); }
.cmd-log-obs   .cmd-log-body   { color: oklch(0.78 0.12 150); }
.cmd-log-obs   .cmd-log-body em { color: var(--cmd-text); font-style: normal; font-weight: 600; }

.cmd-log-act   .cmd-log-prefix { color: var(--cmd-accent2); font-weight: 700; }
.cmd-log-act   .cmd-log-body   { color: var(--cmd-accent2); }
.cmd-log-act   .cmd-log-body b  { color: var(--cmd-text); font-weight: 600; }
.cmd-log-act   .cmd-log-body em { color: var(--cmd-text); font-style: normal; font-weight: 600; }
.cmd-log-act   .cmd-log-label  { color: var(--cmd-accent2); }

.cmd-livelog-foot {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  padding: 12px 18px 14px;
  font-size: 11px;
  color: var(--cmd-text);
  white-space: nowrap;
  overflow: hidden;
  min-height: 44px;
}
.cmd-livelog-foot > div {
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cmd-livelog-foot-label {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--cmd-mute);
}

.cmd-name {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-weight: 700;
  font-size: 72px;
  line-height: 1;
  letter-spacing: -0.03em;
  margin: 0;
  color: var(--cmd-text);
  min-height: 1.05em;
  white-space: nowrap;
}
.cmd-cursor {
  color: var(--cmd-accent);
  display: inline-block;
  margin-left: 2px;
  animation: cmd-blink 1.1s steps(1) infinite;
}
.cmd-cursor-idle { opacity: 0.8; }
@keyframes cmd-blink { 50% { opacity: 0; } }

.cmd-role-row { margin-top: 28px; }
.cmd-role {
  font-size: 15px;
  line-height: 1.55;
  color: var(--cmd-text);
  max-width: 720px;
}
.cmd-role em {
  color: var(--cmd-accent);
  font-style: normal;
  border-bottom: 1px dotted var(--cmd-accent);
}
.cmd-role-prefix {
  display: inline-block;
  color: var(--cmd-mute);
  margin-right: 12px;
  font-size: 12px;
}

.cmd-hero-strip {
  margin-top: 28px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.cmd-strip-label {
  font-size: 10.5px;
  letter-spacing: 0.12em;
  color: var(--cmd-mute);
  text-transform: uppercase;
  flex-shrink: 0;
}

.cmd-marquee {
  overflow: hidden;
  flex: 1;
  mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent);
}
.cmd-marquee-track {
  display: flex;
  gap: 28px;
  white-space: nowrap;
  animation: cmd-marq 28s linear infinite;
}
.cmd-marquee-item {
  font-size: 12px;
  color: var(--cmd-mute);
}
.cmd-marquee-item:nth-child(3n) { color: var(--cmd-accent); }
.cmd-marquee-item:nth-child(5n) { color: var(--cmd-accent2); }
@keyframes cmd-marq {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* panel grid */
.cmd-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 18px;
}
.cmd-panel {
  background: var(--cmd-bg-elev);
  border: 1px solid var(--cmd-border);
  padding: 18px 22px 22px;
  position: relative;
}
.cmd-panel-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--cmd-border);
  padding-bottom: 10px;
  margin-bottom: 16px;
}
.cmd-panel-label {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cmd-accent);
}
.cmd-panel-meta {
  font-size: 11px;
  color: var(--cmd-mute);
}

/* now */
.cmd-now {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 28px;
}
.cmd-now-title {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
}
.cmd-now-role {
  font-size: 22px;
  font-weight: 600;
  color: var(--cmd-text);
}
.cmd-now-co {
  font-size: 14px;
  color: var(--cmd-accent);
}
.cmd-now-div {
  font-size: 11.5px;
  color: var(--cmd-mute);
  letter-spacing: 0.04em;
  margin-top: 4px;
}
.cmd-now-summary {
  font-size: 13px;
  color: var(--cmd-text);
  margin: 14px 0 6px;
  max-width: 56ch;
}
.cmd-now-card {
  background: var(--cmd-surface);
  border: 1px solid var(--cmd-border);
  padding: 14px 16px;
  margin-bottom: 14px;
}
.cmd-now-card-label {
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cmd-mute);
  margin-bottom: 10px;
}
.cmd-stackgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 12px;
}
.cmd-stackchip {
  font-size: 11.5px;
  padding: 4px 8px;
  background: var(--cmd-accent-soft);
  color: var(--cmd-accent);
  border-left: 2px solid var(--cmd-accent);
}
.cmd-now-card-foot {
  display: flex;
  justify-content: space-between;
  font-size: 10.5px;
  color: var(--cmd-mute);
  margin-top: 4px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* lists */
.cmd-ul {
  list-style: none;
  padding: 0;
  margin: 12px 0 0;
}
.cmd-ul li {
  font-size: 12.5px;
  color: var(--cmd-text);
  margin: 6px 0;
  padding-left: 22px;
  position: relative;
  max-width: 70ch;
}
.cmd-bullet {
  position: absolute;
  left: 0;
  color: var(--cmd-accent);
}

/* tags */
.cmd-tag {
  display: inline-block;
  font-size: 10.5px;
  padding: 2px 7px;
  margin: 0 6px 6px 0;
  letter-spacing: 0.04em;
  border: 1px solid var(--cmd-border-strong);
  color: var(--cmd-mute);
  background: transparent;
}
.cmd-tag-accent {
  border-color: var(--cmd-accent);
  color: var(--cmd-accent);
  background: var(--cmd-accent-soft);
}
.cmd-tag-accent2 {
  border-color: var(--cmd-accent2);
  color: var(--cmd-accent2);
  background: var(--cmd-accent2-soft);
}
.cmd-tag-green {
  border-color: oklch(0.78 0.12 150);
  color: oklch(0.78 0.12 150);
  background: oklch(0.78 0.12 150 / 0.10);
}

/* experience */
.cmd-exp { display: flex; flex-direction: column; gap: 20px; }
.cmd-exp-row {
  display: grid;
  grid-template-columns: 64px 1fr;
  gap: 18px;
  padding-bottom: 18px;
  border-bottom: 1px dashed var(--cmd-border);
}
.cmd-exp-row:last-child { border-bottom: none; padding-bottom: 0; }
.cmd-exp-when {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  font-size: 10.5px;
  color: var(--cmd-mute);
  letter-spacing: 0.06em;
  padding-top: 3px;
}
.cmd-exp-dash { color: var(--cmd-border-strong); margin: 2px 0; }
.cmd-mute { color: var(--cmd-mute-2); }
.cmd-exp-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--cmd-text);
}
.cmd-exp-org {
  font-size: 11.5px;
  color: var(--cmd-mute);
  margin-top: 2px;
}
.cmd-exp-tags { margin-top: 8px; }

/* projects */
.cmd-proj-tabs {
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-bottom: 1px dashed var(--cmd-border);
  padding-bottom: 12px;
  margin-bottom: 14px;
}
.cmd-proj-tab {
  all: unset;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  padding: 6px 10px;
  color: var(--cmd-mute);
  border-left: 2px solid transparent;
  transition: all .15s;
}
.cmd-proj-tab:hover { color: var(--cmd-text); }
.cmd-proj-tab.on {
  color: var(--cmd-accent);
  border-left-color: var(--cmd-accent);
  background: var(--cmd-accent-soft);
}
.cmd-proj-kind {
  font-size: 10.5px;
  color: var(--cmd-mute);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.cmd-proj-title {
  font-size: 17px;
  font-weight: 600;
  margin: 4px 0 10px;
  line-height: 1.25;
}
.cmd-proj-metric {
  display: inline-block;
  padding: 6px 12px;
  background: var(--cmd-accent-soft);
  border-left: 2px solid var(--cmd-accent);
  margin-bottom: 12px;
}
.cmd-proj-metric-val {
  font-size: 22px;
  color: var(--cmd-accent);
  font-weight: 600;
  margin-right: 8px;
}
.cmd-proj-metric-lab {
  font-size: 11px;
  color: var(--cmd-mute);
}
.cmd-proj-blurb {
  font-size: 12.5px;
  color: var(--cmd-text);
  margin: 0 0 10px;
}
.cmd-proj-stack { margin-bottom: 12px; }
.cmd-proj-divider {
  font-size: 10.5px;
  letter-spacing: 0.12em;
  color: var(--cmd-mute);
  text-transform: uppercase;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed var(--cmd-border);
}

/* skills */
.cmd-skills-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px 36px;
}
.cmd-skills-group {
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cmd-accent2);
  margin-bottom: 8px;
}
.cmd-skills-items { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.cmd-skill-item {
  font-size: 11.5px;
  padding: 3px 7px;
  background: var(--cmd-surface);
  color: var(--cmd-text);
  border: 1px solid var(--cmd-border);
}

/* patents */
.cmd-patent {
  padding: 12px 0;
  border-bottom: 1px dashed var(--cmd-border);
}
.cmd-patent:last-child { border-bottom: none; }
.cmd-patent-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.cmd-patent-id {
  font-size: 10.5px;
  color: var(--cmd-mute);
  letter-spacing: 0.1em;
}
.cmd-patent-area {
  font-size: 13px;
  color: var(--cmd-text);
  font-weight: 500;
  margin-bottom: 4px;
}
.cmd-patent-note {
  font-size: 11.5px;
  color: var(--cmd-mute);
}

/* award */
.cmd-award {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.cmd-award-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--cmd-text);
}
.cmd-award-sub {
  font-size: 12px;
  color: var(--cmd-accent2);
  margin-top: 2px;
}

/* education */
.cmd-edu-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--cmd-text);
}
.cmd-edu-sub {
  font-size: 12px;
  color: var(--cmd-mute);
  margin-top: 2px;
  margin-bottom: 14px;
}
.cmd-edu-cw-label {
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cmd-accent2);
  margin-bottom: 8px;
}
.cmd-edu-cw {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 6px;
}

/* foot */
.cmd-foot {
  margin: 56px 32px 0;
  max-width: 1180px;
  margin-left: auto;
  margin-right: auto;
  padding: 28px 32px 0;
  border-top: 1px solid var(--cmd-border);
}
.cmd-foot-prompt {
  font-size: 16px;
  margin-bottom: 24px;
}
.cmd-foot-prompt .cmd-foot-cmd { color: var(--cmd-text); }
.cmd-accent { color: var(--cmd-accent); }
.cmd-accent2 { color: var(--cmd-accent2); }

.cmd-foot-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 28px;
}
.cmd-foot-link {
  display: flex;
  flex-direction: column;
  padding: 14px 16px;
  background: var(--cmd-bg-elev);
  border: 1px solid var(--cmd-border);
  text-decoration: none;
  color: var(--cmd-text);
  font-size: 13px;
  transition: border-color .15s, background .15s;
}
.cmd-foot-link:hover {
  border-color: var(--cmd-accent);
  background: var(--cmd-accent-soft);
}
.cmd-foot-link .cmd-mute {
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.cmd-foot-copy {
  font-size: 11px;
  color: var(--cmd-mute);
  letter-spacing: 0.05em;
  text-align: center;
}

/* ── cycling tagline word ─────────────────────────────────── */
.cmd-cycle {
  display: inline-block;
  transition: opacity .22s ease, transform .22s ease;
  will-change: opacity, transform;
}
.cmd-cycle.on  { opacity: 1; transform: translateY(0); }
.cmd-cycle.off { opacity: 0; transform: translateY(4px); }
.cmd-cycle-strong {
  color: var(--cmd-accent);
  font-weight: 600;
  padding: 0 2px;
  border-bottom: 1px dashed var(--cmd-accent);
}

/* ── recruiter-grab metrics strip (sits between hero & grid) ── */
.cmd-metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  margin: 0 0 18px;
  border: 1px solid var(--cmd-border);
  background: var(--cmd-bg-elev);
}
.cmd-metric {
  padding: 18px 22px 20px;
  border-right: 1px solid var(--cmd-border);
  position: relative;
}
.cmd-metric:last-child { border-right: none; }
.cmd-metric::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 24px;
  background: var(--cmd-accent);
}
.cmd-metric:nth-child(2)::before { background: var(--cmd-accent2); }
.cmd-metric:nth-child(3)::before { background: var(--cmd-accent2); }
.cmd-metric:nth-child(4)::before { background: var(--cmd-accent); }

.cmd-metric-val {
  font-size: 40px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--cmd-text);
  margin-bottom: 10px;
  font-variant-numeric: tabular-nums;
}
.cmd-metric-lab {
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--cmd-accent);
  margin-bottom: 6px;
}
.cmd-metric:nth-child(2) .cmd-metric-lab,
.cmd-metric:nth-child(3) .cmd-metric-lab {
  color: var(--cmd-accent2);
}
.cmd-metric-sub {
  font-size: 12px;
  color: var(--cmd-mute);
  letter-spacing: 0.02em;
}

/* ── prominent live cards row inside Now panel ───────────── */
/* Now panel — 2 column: currently-active list on left, live cards stacked on right */
.cmd-now-split {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 28px;
  align-items: start;
}
.cmd-now-split-left {
  min-width: 0;
}
.cmd-now-split-right {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

.cmd-live-row {
  display: grid;
  grid-template-columns: 1.1fr 1.2fr 1fr;
  gap: 14px;
  margin-bottom: 22px;
}
.cmd-live-card {
  background: var(--cmd-bg);
  border: 1px solid var(--cmd-border-strong);
  padding: 16px 18px 18px;
  position: relative;
  overflow: hidden;
}
.cmd-live-card::after {
  content: '';
  position: absolute;
  inset: 0 0 auto 0;
  height: 2px;
  background: linear-gradient(90deg, var(--cmd-accent), transparent);
}
.cmd-live-stack::after  { background: linear-gradient(90deg, var(--cmd-accent), transparent); }
.cmd-live-tok::after    { background: linear-gradient(90deg, var(--cmd-accent2), transparent); }
.cmd-live-gpu::after    { background: linear-gradient(90deg, var(--cmd-accent), var(--cmd-accent2)); }

.cmd-live-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.cmd-live-label {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cmd-text);
  font-weight: 500;
}
.cmd-live-meta {
  font-size: 10px;
  color: var(--cmd-mute);
  letter-spacing: 0.06em;
}
.cmd-live-foot {
  margin-top: 8px;
  font-size: 10px;
  color: var(--cmd-mute);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* widened "currently active" — used inside Now panel without the 2-col wrapper */
.cmd-current-wide {
  margin-top: 0;
}
.cmd-current-wide .cmd-current-row {
  margin: 8px 0;
}
.cmd-current-wide .cmd-current-status {
  min-width: 96px;
}
.cmd-current-wide .cmd-current-text {
  font-size: 13.5px;
}

/* "What I own" + "currently active" two-up grid in Now */
.cmd-now-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
}
.cmd-now-card-label-stand {
  color: var(--cmd-accent);
  margin-bottom: 12px;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* hero-metrics override: remove the old full-width strip styles since they're gone */
.cmd-metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  margin: 0 0 28px;
  border: 1px solid var(--cmd-border);
  background: var(--cmd-bg-elev);
}
.cmd-metric {
  padding: 20px 22px 22px;
  border-right: 1px solid var(--cmd-border);
  position: relative;
}
.cmd-metric:last-child { border-right: none; }
.cmd-metric::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 24px;
  background: var(--cmd-accent);
}
.cmd-metric:nth-child(2)::before { background: var(--cmd-accent2); }
.cmd-metric:nth-child(3)::before { background: var(--cmd-accent); }
.cmd-metric:nth-child(4)::before { background: var(--cmd-accent2); }

.cmd-metric-val {
  font-size: 44px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--cmd-text);
  margin-bottom: 8px;
  font-variant-numeric: tabular-nums;
}
.cmd-metric-lab {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cmd-accent);
  margin-bottom: 4px;
}
.cmd-metric:nth-child(2) .cmd-metric-lab,
.cmd-metric:nth-child(4) .cmd-metric-lab {
  color: var(--cmd-accent2);
}
.cmd-metric-sub {
  font-size: 11px;
  color: var(--cmd-mute);
  letter-spacing: 0.02em;
}

/* ── "currently active" log in Now panel ─────────────────── */
.cmd-current {
  margin: 18px 0 14px;
  padding: 14px 16px 12px;
  background: var(--cmd-surface);
  border-left: 2px solid var(--cmd-accent);
}
.cmd-current-label {
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cmd-accent);
  margin-bottom: 10px;
}
.cmd-current-row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin: 5px 0;
  animation: cmd-fade-up .45s ease both;
}
@keyframes cmd-fade-up {
  from { opacity: 0; transform: translateY(4px); }
}
.cmd-current-status {
  display: inline-block;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 2px 7px;
  flex-shrink: 0;
  min-width: 78px;
  text-align: center;
  position: relative;
}
.cmd-current-status::before {
  content: '';
  position: absolute;
  left: -2px; top: 50%;
  width: 5px; height: 5px;
  border-radius: 50%;
  transform: translate(-100%, -50%);
  animation: cmd-pulse 1.6s ease-in-out infinite;
}
.cmd-current-shipping   { background: var(--cmd-accent-soft); color: var(--cmd-accent); }
.cmd-current-shipping::before { background: var(--cmd-accent); box-shadow: 0 0 6px var(--cmd-accent); }
.cmd-current-optimizing { background: var(--cmd-accent2-soft); color: var(--cmd-accent2); }
.cmd-current-optimizing::before { background: var(--cmd-accent2); box-shadow: 0 0 6px var(--cmd-accent2); }
.cmd-current-authoring  { background: var(--cmd-accent-soft); color: var(--cmd-accent); }
.cmd-current-authoring::before { background: var(--cmd-accent); box-shadow: 0 0 6px var(--cmd-accent); }
.cmd-current-aligning   { background: var(--cmd-accent2-soft); color: var(--cmd-accent2); }
.cmd-current-aligning::before { background: var(--cmd-accent2); box-shadow: 0 0 6px var(--cmd-accent2); }
.cmd-current-building    { background: var(--cmd-accent-soft); color: var(--cmd-accent); }
.cmd-current-building::before { background: var(--cmd-accent); box-shadow: 0 0 6px var(--cmd-accent); }
.cmd-current-championing { background: var(--cmd-accent2-soft); color: var(--cmd-accent2); }
.cmd-current-championing::before { background: var(--cmd-accent2); box-shadow: 0 0 6px var(--cmd-accent2); }
.cmd-current-text {
  font-size: 12.5px;
  color: var(--cmd-text);
}

/* ── GPU gauge ───────────────────────────────────────────── */
.cmd-gauge { margin-top: 4px; }
.cmd-gauge-bar {
  position: relative;
  height: 22px;
  background: var(--cmd-bg);
  border: 1px solid var(--cmd-border);
  overflow: hidden;
}
.cmd-gauge-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: linear-gradient(90deg,
    var(--cmd-accent2) 0%,
    var(--cmd-accent) 70%,
    var(--cmd-accent) 100%);
  transition: width .85s cubic-bezier(.4, 0, .2, 1);
}
.cmd-gauge-tick {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: oklch(0.16 0.018 245 / 0.5);
}
.cmd-gauge-foot {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--cmd-mute);
  font-variant-numeric: tabular-nums;
}

/* ── Impact panel (before/after bars) ─────────────────────── */
.cmd-impact-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.cmd-impact-card {
  background: var(--cmd-surface);
  border: 1px solid var(--cmd-border);
  padding: 16px 18px 18px;
  position: relative;
  overflow: hidden;
}
.cmd-impact-card::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 80px; height: 80px;
  background:
    radial-gradient(circle at 100% 0%, var(--cmd-accent-soft), transparent 70%);
  pointer-events: none;
}
.cmd-impact-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
  gap: 12px;
}
.cmd-impact-kind {
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--cmd-mute);
}
.cmd-impact-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--cmd-text);
  margin-top: 4px;
  max-width: 26ch;
  line-height: 1.3;
}
.cmd-impact-lift {
  flex-shrink: 0;
  padding: 6px 10px;
  background: var(--cmd-accent-soft);
  color: var(--cmd-accent);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.01em;
  border: 1px solid var(--cmd-accent);
  white-space: nowrap;
}
.cmd-impact-bars {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.cmd-impact-row {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 10px;
  align-items: center;
}
.cmd-impact-label {
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--cmd-mute);
}
.cmd-impact-track {
  position: relative;
  height: 22px;
  background: var(--cmd-bg);
  border: 1px solid var(--cmd-border);
  overflow: hidden;
}
.cmd-impact-fill {
  position: absolute;
  inset: 0 auto 0 0;
  transition: width 1.1s cubic-bezier(.4, 0, .2, 1);
}
.cmd-impact-before {
  background: repeating-linear-gradient(
    45deg,
    var(--cmd-mute-2) 0 4px,
    transparent 4px 8px
  );
  opacity: 0.5;
}
.cmd-impact-after {
  background: linear-gradient(90deg,
    var(--cmd-accent) 0%,
    var(--cmd-accent-deep) 100%);
}
.cmd-impact-val {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--cmd-text);
  text-shadow: 0 0 4px var(--cmd-bg);
}

/* ══════════════════════════════════════════════════════════════
   RESPONSIVE — laptop / tablet / mobile
   Strategy: collapse the 12-col grid, stack multi-column panels,
   shrink hero typography, reflow the metric strip, allow horizontal
   scroll only on the marquee. No fixed widths anywhere below.
   ══════════════════════════════════════════════════════════════ */

/* ── Laptop (≤1180px): tighten paddings ── */
@media (max-width: 1180px) {
  .cmd-frame { padding: 32px 24px 0; }
  .cmd-statusbar { padding: 10px 20px; }
  .cmd-foot { padding: 28px 24px 0; }
  .cmd-name { font-size: 60px; }
  .cmd-hero-grid { gap: 28px; }
  .cmd-statement { font-size: 22px; }
  .cmd-anchor-row { font-size: 18px; }
  .cmd-chip { padding: 8px 14px; font-size: 12px; }
}

/* ── Tablet (≤960px): live log moves below hero text ── */
@media (max-width: 960px) {
  .cmd-frame { padding: 24px 20px 0; }
  .cmd-statusbar {
    padding: 8px 16px;
    font-size: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .cmd-statusbar .cmd-status-time { display: none; }
  .cmd-foot { padding: 24px 20px 0; }

  .cmd-name { font-size: 56px; }
  .cmd-statement { font-size: 20px; }

  /* Stack hero — live log goes below */
  .cmd-hero-grid {
    grid-template-columns: 1fr;
    gap: 28px;
  }
  .cmd-livelog-body { min-height: 280px; }

  /* Metrics: 2x2 on tablet */
  .cmd-metrics { grid-template-columns: 1fr 1fr; }
  .cmd-metric { border-right: 1px solid var(--cmd-border); border-bottom: 1px solid var(--cmd-border); }
  .cmd-metric:nth-child(2n) { border-right: none; }
  .cmd-metric:nth-last-child(-n+2) { border-bottom: none; }
  .cmd-metric-val { font-size: 34px; }

  .cmd-now-header { grid-template-columns: 1fr; gap: 12px; }
  .cmd-now-split { grid-template-columns: 1fr; gap: 20px; }
  .cmd-live-row { grid-template-columns: 1fr 1fr; }
  .cmd-live-gpu { grid-column: 1 / -1; }
  .cmd-now-grid { grid-template-columns: 1fr; gap: 18px; }

  .cmd-impact-grid { grid-template-columns: 1fr 1fr; }
  .cmd-award { grid-template-columns: 1fr; gap: 16px; }

  .cmd-grid { grid-template-columns: 1fr; gap: 14px; }
  .cmd-panel { grid-column: 1 / -1 !important; }

  .cmd-foot-grid { gap: 10px; }
}

/* ── Mobile (≤640px): everything single column ── */
@media (max-width: 640px) {
  .cmd-frame { padding: 18px 12px 0; }
  .cmd-statusbar {
    padding: 8px 12px;
    font-size: 9.5px;
  }
  .cmd-statusbar .cmd-sep { margin: 0 6px; }
  .cmd-chip { padding: 7px 12px; font-size: 11.5px; }
  .cmd-foot { padding: 20px 12px 0; margin-top: 32px; }

  .cmd-hero { padding: 18px 0 28px; margin-bottom: 22px; }
  .cmd-hero-id {
    flex-direction: column;
    gap: 4px;
    align-items: flex-start;
    margin-bottom: 12px;
    font-size: 10px;
  }
  .cmd-name {
    font-size: 44px;
    line-height: 1;
    min-height: 1.1em;
    letter-spacing: -0.02em;
    white-space: normal;  /* allow wrap on phone if needed */
  }
  .cmd-hero-grid { gap: 22px; }
  .cmd-hero-left { gap: 18px; }

  .cmd-anchor-row { font-size: 16px; }
  .cmd-anchor-sub { font-size: 11px; }
  .cmd-statement { font-size: 18px; max-width: none; }

  /* Live log compact */
  .cmd-livelog-body { padding: 10px 14px 4px; height: 320px; }
  .cmd-livelog-head { padding: 10px 14px 8px; }
  .cmd-livelog-rule { margin: 0 14px; }
  .cmd-livelog-foot { padding: 10px 14px 12px; font-size: 10px; }
  .cmd-livelog-foot { grid-template-columns: 1fr; gap: 6px; }
  .cmd-livelog-foot > div { flex-direction: row; gap: 8px; align-items: baseline; }
  .cmd-log-line { grid-template-columns: 14px 1fr; gap: 6px; font-size: 11.5px; }

  /* Metrics: single column */
  .cmd-metrics { grid-template-columns: 1fr; }
  .cmd-metric {
    border-right: none !important;
    border-bottom: 1px solid var(--cmd-border);
    padding: 14px 16px;
  }
  .cmd-metric:last-child { border-bottom: none; }
  .cmd-metric-val { font-size: 30px; }

  /* Now panel live cards stack */
  .cmd-live-row { grid-template-columns: 1fr; }
  .cmd-live-gpu { grid-column: auto; }

  .cmd-panel { padding: 14px 16px 16px; }
  .cmd-panel-head { padding-bottom: 8px; margin-bottom: 12px; }
  .cmd-panel-label { font-size: 10.5px; }
  .cmd-panel-meta { font-size: 10.5px; }

  .cmd-now-role { font-size: 18px; }
  .cmd-now-co { font-size: 13px; }
  .cmd-now-title { gap: 8px; flex-direction: column; align-items: flex-start; }
  .cmd-stackgrid { grid-template-columns: 1fr 1fr; }

  .cmd-current-row { flex-wrap: wrap; gap: 6px 10px; }
  .cmd-current-status { min-width: 0; padding: 2px 8px; }
  .cmd-current-text { font-size: 12px; }

  .cmd-impact-grid { grid-template-columns: 1fr; gap: 14px; }
  .cmd-impact-row { grid-template-columns: 70px 1fr; gap: 8px; }
  .cmd-impact-label { font-size: 9.5px; }
  .cmd-impact-title { font-size: 13px; }
  .cmd-impact-lift { font-size: 12px; padding: 5px 8px; }

  .cmd-exp-row { grid-template-columns: 52px 1fr; gap: 12px; padding-bottom: 14px; }
  .cmd-exp-title { font-size: 13px; }
  .cmd-exp-org { font-size: 11px; }

  .cmd-skills-grid { grid-template-columns: 1fr; gap: 18px; }

  .cmd-foot-prompt { font-size: 14px; flex-wrap: wrap; }
  .cmd-foot-grid { grid-template-columns: 1fr; gap: 8px; margin-bottom: 22px; }
  .cmd-foot-copy { font-size: 10px; }

  .cmd-proj-tab { font-size: 11.5px; padding: 5px 8px; }
  .cmd-proj-title { font-size: 15px; }
  .cmd-proj-metric-val { font-size: 18px; }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>

  <script type="text/babel">
// Direction B — "Command Surface"
// Dark dashboard / systems readout. Chartreuse + terracotta on warm-cool dark.
// Recruiter-grabbing: typed name, cycling role line, animated metric strip,
// live "currently" log, GPU gauge, before/after impact bars.

const CMD = (() => {
  const c = window.CONTENT;
  if (!c) return () => null;

  // ─────────────────────────────────────────────────────────────
  // primitives
  // ─────────────────────────────────────────────────────────────

  function useLocalTime() {
    const [t, setT] = React.useState(new Date());
    React.useEffect(() => {
      const id = setInterval(() => setT(new Date()), 1000);
      return () => clearInterval(id);
    }, []);
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())} PT`;
  }

  // Typewriter — types out text one char at a time, then leaves the cursor blinking.
  // Pass `keepCursor={false}` to hide the cursor once typing completes (useful when
  // multiple Typewriters are stacked — only the last one should retain a cursor).
  function Typewriter({ text, speed = 90, delay = 0, className = '', keepCursor = true }) {
    const [out, setOut] = React.useState('');
    const [done, setDone] = React.useState(false);
    React.useEffect(() => {
      let cancelled = false;
      let i = 0;
      const start = setTimeout(() => {
        const id = setInterval(() => {
          if (cancelled) return;
          i++;
          setOut(text.slice(0, i));
          if (i >= text.length) {
            clearInterval(id);
            setDone(true);
          }
        }, speed);
      }, delay);
      return () => { cancelled = true; clearTimeout(start); };
    }, [text, speed, delay]);
    const showCursor = !done || keepCursor;
    return (
      <span className={className}>
        {out}
        {showCursor && (
          <span className={`cmd-cursor ${done ? 'cmd-cursor-idle' : ''}`}>▌</span>
        )}
      </span>
    );
  }

  // Animated counter — counts from 0 → target on mount (or when target changes).
  function Counter({ to, suffix = '', duration = 1400, delay = 0 }) {
    const [n, setN] = React.useState(0);
    React.useEffect(() => {
      let raf;
      const t0 = performance.now() + delay;
      const ease = (x) => 1 - Math.pow(1 - x, 3);
      const tick = (now) => {
        const t = Math.max(0, Math.min(1, (now - t0) / duration));
        setN(Math.round(ease(t) * to));
        if (t < 1) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(raf);
    }, [to, duration, delay]);
    return <>{n}{suffix}</>;
  }

  // Cycles through items with a fade swap.
  function Cycle({ items, interval = 2400, className = '' }) {
    const [i, setI] = React.useState(0);
    const [vis, setVis] = React.useState(true);
    React.useEffect(() => {
      const id = setInterval(() => {
        setVis(false);
        setTimeout(() => {
          setI((x) => (x + 1) % items.length);
          setVis(true);
        }, 220);
      }, interval);
      return () => clearInterval(id);
    }, [items.length, interval]);
    return (
      <span className={`cmd-cycle ${className} ${vis ? 'on' : 'off'}`}>
        {items[i]}
      </span>
    );
  }

  // Marquee strip
  function MarqueeStrip({ items }) {
    return (
      <div className="cmd-marquee">
        <div className="cmd-marquee-track">
          {[...items, ...items].map((s, i) => (
            <span key={i} className="cmd-marquee-item">{s}</span>
          ))}
        </div>
      </div>
    );
  }

  // Animated sparkline (decorative; "tok/s") — simple SVG, responsive via ResizeObserver.
  function Sparkline({ height = 56 }) {
    const containerRef = React.useRef(null);
    const [w, setW] = React.useState(500);

    React.useEffect(() => {
      const el = containerRef.current;
      if (!el) return;
      setW(el.clientWidth);
      const ro = new ResizeObserver((entries) => {
        setW(Math.round(entries[0].contentRect.width));
      });
      ro.observe(el);
      return () => ro.disconnect();
    }, []);

    const N = 48;
    const [pts, setPts] = React.useState(() =>
      Array.from({ length: N }, () => 0.25 + Math.random() * 0.6));

    React.useEffect(() => {
      const id = setInterval(() => {
        setPts((p) => [...p.slice(1), 0.25 + Math.random() * 0.6]);
      }, 1000);
      return () => clearInterval(id);
    }, []);

    const h = height;
    const stepX = w / (N - 1);
    let d = '';
    for (let i = 0; i < N; i++) {
      const x = i * stepX;
      const y = h - pts[i] * (h - 8) - 4;
      d += (i === 0 ? 'M' : 'L') + `${x.toFixed(1)} ${y.toFixed(1)} `;
    }
    const area = d + `L ${w} ${h} L 0 ${h} Z`;
    const lastY = h - pts[N - 1] * (h - 8) - 4;

    return (
      <div ref={containerRef} style={{ width: '100%', height }}>
        <svg width={w} height={h} style={{ display: 'block', overflow: 'visible' }}>
          <defs>
            <linearGradient id="cmd-spark-fill" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor="var(--cmd-accent)" stopOpacity="0.25" />
              <stop offset="100%" stopColor="var(--cmd-accent)" stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={area} fill="url(#cmd-spark-fill)" />
          <path d={d} fill="none" stroke="var(--cmd-accent)" strokeWidth="1.6" strokeLinejoin="round" />
          <circle cx={w} cy={lastY} r="2.8" fill="var(--cmd-accent)" />
        </svg>
      </div>
    );
  }

  // Animated GPU "utilization" gauge (decorative — picks a wandering target).
  function GpuGauge() {
    const [v, setV] = React.useState(72);
    React.useEffect(() => {
      const id = setInterval(() => {
        setV((cur) => Math.max(40, Math.min(96, cur + (Math.random() - 0.5) * 18)));
      }, 900);
      return () => clearInterval(id);
    }, []);
    return (
      <div className="cmd-gauge">
        <div className="cmd-gauge-bar">
          <div className="cmd-gauge-fill" style={{ width: `${v}%` }} />
          {Array.from({ length: 20 }).map((_, i) => (
            <span key={i} className="cmd-gauge-tick" style={{ left: `${(i / 20) * 100}%` }} />
          ))}
        </div>
        <div className="cmd-gauge-foot">
          <span>A100 · 80GB</span>
          <span className="cmd-accent">{Math.round(v)}%</span>
        </div>
      </div>
    );
  }

  // Before/after animated comparison bar
  function ImpactBar({ before, after, inverted = false }) {
    const max = Math.max(before.value, after.value);
    const [render, setRender] = React.useState(false);
    React.useEffect(() => {
      const id = setTimeout(() => setRender(true), 60);
      return () => clearTimeout(id);
    }, []);
    const wBefore = render ? (before.value / max) * 100 : 0;
    const wAfter  = render ? (after.value / max) * 100 : 0;
    return (
      <div className="cmd-impact-bars">
        <div className="cmd-impact-row">
          <div className="cmd-impact-label">{before.label}</div>
          <div className="cmd-impact-track">
            <div className="cmd-impact-fill cmd-impact-before" style={{ width: `${wBefore}%` }} />
            <span className="cmd-impact-val">{before.value}{before.unit}</span>
          </div>
        </div>
        <div className="cmd-impact-row">
          <div className="cmd-impact-label">{after.label}</div>
          <div className="cmd-impact-track">
            <div className="cmd-impact-fill cmd-impact-after" style={{ width: `${wAfter}%` }} />
            <span className="cmd-impact-val cmd-accent">{after.value}{after.unit}</span>
          </div>
        </div>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────
  // small UI atoms
  // ─────────────────────────────────────────────────────────────

  function Panel({ label, meta, children, span, style }) {
    return (
      <div className="cmd-panel" style={{ gridColumn: span ? `span ${span}` : undefined, ...style }}>
        <div className="cmd-panel-head">
          <span className="cmd-panel-label">{label}</span>
          {meta && <span className="cmd-panel-meta">{meta}</span>}
        </div>
        <div className="cmd-panel-body">{children}</div>
      </div>
    );
  }

  function Tag({ children, tone = 'mute' }) {
    return <span className={`cmd-tag cmd-tag-${tone}`}>{children}</span>;
  }

  function Bullets({ items }) {

  // ── Continuous live "session" log — think → call → obs → act ───
  // Modeled on the agent-reasoning trace: minimal 2-col layout, no agent

  function LiveLog() {
    const SESSIONS = React.useMemo(() => ([
      // 1 — camera receipt → split with Alex
      {
        name: 'galaxy-cam/agent-runtime.session',
        proj: 'galaxy-cam',
        tools: 'vision · contacts · pay',
        steps: [
          ['think', <>user pointed camera at a paper receipt — said "split with Alex".</>],

          ['obs',   <>{'{ items: 7, subtotal: $48.20, tip: $9.00, total: $57.20 }'}</>],
          ['think', <>two diners — split evenly, need Alex's contact.</>],
          ['call',  ['contacts.search', '{q: "Alex", scope: "recents"}']],
          ['obs',   <>{'{ match: "Alex Park" · ★ starred · venmo: @alex.park }'}</>],
          ['think', <>half of $57.20 = $28.60 — draft payment.</>],
          ['call',  ['payments.draft', '{to: "@alex.park", amount: 28.60, memo: "dinner"}']],
          ['obs',   <>{'{ draft_id: "pay_9f2a" · status: ready }'}</>],
          ['act',   <>Send <b>$28.60</b> to <b>Alex Park</b> — <em>confirm?</em></>],
        ],
      },

      // 2 — whiteboard notes → calendar
      {
        name: 'galaxy-cam/agent-runtime.session',
        proj: 'galaxy-cam',
        tools: 'vision · calendar · notes',
        steps: [
          ['think', <>camera frame: handwritten meeting notes on whiteboard.</>],
          ['call',  ['vision.transcribe_handwriting', '{frame: cam.current()}']],
          ['obs',   <>{'{ lines: 14, dates: 2, action_items: 3 }'}</>],
          ['think', <>three action items — route to team tracker.</>],
          ['call',  ['calendar.next_event', '{owner: me, attendees: "team-andro"}']],
          ['obs',   <>{'{ event: "galaxy-ai sync" · thu 10:00 PT }'}</>],
          ['think', <>attach parsed notes to the thursday sync.</>],
          ['call',  ['notes.create', '{title: "WB · galaxy-ai sync", share: attendees}']],
          ['obs',   <>{'{ note_id: "n_4a8c" · shared: 6 attendees }'}</>],
          ['act',   <>Saved <b>3 action items</b> → <b>shared notes</b> · attached to Thu sync.</>],
        ],
      },

      // 3 — flight extraction → calendar
      {
        name: 'galaxy-cam/agent-runtime.session',
        proj: 'galaxy-cam',
        tools: 'vision · calendar · device',
        steps: [
          ['think', <>gallery preview: screenshot of flight confirmation email.</>],
          ['call',  ['vision.extract_structured', '{schema: "flight_itinerary"}']],
          ['obs',   <>{'{ carrier: UA, flight: 712, dep: SFO 06:35, arr: ICN 12:10+1 }'}</>],
          ['think', <>create calendar event with departure reminders.</>],
          ['call',  ['calendar.create_event', '{title: "UA 712 SFO→ICN", src: "flight"}']],
          ['obs',   <>{'{ event_id: "evt_88c1" · reminders: 2 (24h, 3h) }'}</>],
          ['call',  ['device.set_mode', '{mode: "airport", trigger: "arrival_window"}']],
          ['obs',   <>{'{ scheduled: true · activates: dep - 2h }'}</>],
          ['act',   <>Calendar event created · <b>airport-mode</b> armed for departure.</>],
        ],
      },

      // 4 — inference tuning
      {
        name: 'llm-serve/inference.tune.session',
        proj: 'llm-serve',
        tools: 'profiler · backend · deploy',
        steps: [
          ['think', <>p99 on <em>llama-3-70b</em> hit 380ms — need &lt;200ms to ship.</>],
          ['call',  ['profiler.run', '{target: "agent_loop", n: 1000}']],
          ['obs',   <>{'{ bottleneck: kv-cache prefill @ 312ms (82%) }'}</>],
          ['think', <>swap to continuous batching — should reclaim prefill cost.</>],
          ['call',  ['backend.switch', '{to: "vllm", batch: "continuous"}']],
          ['obs',   <>{'{ p50: 89ms · p99: 168ms · tok/s: 192 · +35% }'}</>],
          ['think', <>p99 under budget — canary it.</>],
          ['call',  ['deploy.canary', '{pct: 5, region: "us-west-2"}']],
          ['obs',   <>{'{ canary: live · errors: 0 · latency: nominal }'}</>],
          ['act',   <>Canary live · <b>us-west-2 · 5%</b> · 0 errors @ 4m.</>],
        ],
      },
    ]), []);

    const [rows, setRows] = React.useState([]);
    const [sessionName, setSessionName] = React.useState(SESSIONS[0].name);
    const [proj, setProj] = React.useState(SESSIONS[0].proj);
    const [tools, setTools] = React.useState(SESSIONS[0].tools);
    const [turn, setTurn] = React.useState(3);

    React.useEffect(() => {
      let cancelled = false;
      let sIdx = 0;
      let key = 0;
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      async function play() {
        await wait(500);
        while (!cancelled) {
          const session = SESSIONS[sIdx % SESSIONS.length];
          setSessionName(session.name);
          setProj(session.proj);
          setTools(session.tools);

          for (let i = 0; i < session.steps.length; i++) {
            if (cancelled) return;
            const [kind, payload] = session.steps[i];
            key += 1;
            setRows((prev) => [...prev, { key, kind, payload }]);
            const delay = kind === 'act'  ? 2400
                        : kind === 'obs'  ? 720
                        : kind === 'call' ? 620
                        : 560; // think
            await wait(delay);
          }
          if (cancelled) return;

          setRows((prev) => prev.map((r) => ({ ...r, out: true })));
          await wait(900);
          if (cancelled) return;

          setRows([]);
          sIdx += 1;
          setTurn((t) => t + 1);
          await wait(450);
        }
      }
      play();
      return () => { cancelled = true; };
    }, [SESSIONS]);

  <script type="text/babel">
// Top-level: Command Surface only, fullscreen, + tweaks panel.

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "cmdAccentHue": 115,
  "monoFamily": "JetBrains Mono"
}/*EDITMODE-END*/;

const CMD_HUES = [
  { value: 115, label: 'chartreuse' },
  { value: 30,  label: 'terracotta' },
  { value: 220, label: 'ice' },
  { value: 320, label: 'magenta' },
];

const MONO_FONTS = ['JetBrains Mono', 'IBM Plex Mono', 'Fira Code', 'Geist Mono'];

function deriveCmdVars(hue) {
  return {
    '--cmd-accent':       `oklch(0.86 0.18 ${hue})`,
    '--cmd-accent-soft':  `oklch(0.86 0.18 ${hue} / 0.10)`,
    '--cmd-accent-deep':  `oklch(0.70 0.16 ${hue})`,
  };
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    const root = document.documentElement;
    const cmd = deriveCmdVars(t.cmdAccentHue);
    Object.entries(cmd).forEach(([k, v]) => root.style.setProperty(k, v));
    root.style.setProperty(
      '--mono-stack',
      `"${t.monoFamily}", ui-monospace, monospace`,
    );
    document.querySelectorAll('.cmd-root, .cmd-statusbar').forEach((el) => {
      el.style.fontFamily = `"${t.monoFamily}", ui-monospace, monospace`;
    });
  }, [t.cmdAccentHue, t.monoFamily]);

  const CommandSurface = window.CommandSurface;

  return (
    <>
      <CommandSurface />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Color" />
        <TweakRadio
          label="Accent hue"
          value={t.cmdAccentHue}
          options={CMD_HUES}
          onChange={(v) => setTweak('cmdAccentHue', v)}
        />

        <TweakSection label="Typography" />
        <TweakSelect
          label="Mono family"
          value={t.monoFamily}
          options={MONO_FONTS}
          onChange={(v) => setTweak('monoFamily', v)}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
